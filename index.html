
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ThalSMP 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
    pointer-events: none;
}

/* Everything the player interacts with */
#interactionLayer {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: auto;
    font-family: "Press Start 2P", cursive;
}

/* -------------------- */
/* WELCOME SCREEN */
/* -------------------- */

#welcomeScreen {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    text-align: center;

    opacity: 1;

    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}

#welcomeText {
    color: white;

    font-size: clamp(30px, 5vw, 64px);

    text-shadow:
        3px 3px 0 black,
        -2px -2px 0 black,
        2px -2px 0 black,
        -2px 2px 0 black;

    min-height: 1.5em;
}

/* Click to Proceed */

#proceedArea {
    margin-top: 35px;

    display: flex;
    align-items: center;
    flex-direction: column;

    cursor: pointer;

    opacity: 0;

    transition: opacity 0.7s ease;

    pointer-events: auto;
}

#proceedArea.visible {
    opacity: 1;
}

#proceedText {
    color: black;

    font-family: Arial, sans-serif;
    font-size: 18px;

    margin-bottom: 10px;

    text-shadow:
        1px 1px 0 white,
        -1px -1px 0 white,
        1px -1px 0 white,
        -1px 1px 0 white;
}

#proceedButton {
    width: 150px;
    height: auto;

    image-rendering: pixelated;

    user-select: none;
    -webkit-user-drag: none;
}

/* -------------------- */
/* LORE SCREEN */
/* -------------------- */

#loreScreen {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.7s ease;
}

#loreScreen.visible {
    opacity: 1;
    pointer-events: auto;
}

#loreContainer {
    position: relative;

    width: min(80vw, 800px);

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    cursor: pointer;
}

/* Realm symbols */

#realmSymbol {
    width: clamp(100px, 14vw, 190px);
    height: clamp(100px, 14vw, 190px);

    object-fit: contain;

    image-rendering: pixelated;

    margin-bottom: -10px;

    opacity: 0;

    transform: scale(0.85);

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;

    user-select: none;
    pointer-events: none;
}

#realmSymbol.visible {
    opacity: 1;

    transform: scale(1);
}

/* Lore box */

#loreBox {
    position: absolute;

    width: 100%;
    height: auto;

    image-rendering: pixelated;

    pointer-events: none;

    user-select: none;
}

/* Text inside the box */

#loreText {
    position: relative;

    width: 84%;

    min-height: 180px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 50px 8% 45px;
    box-sizing: border-box;

    color: white;

    font-size: clamp(16px, 2vw, 27px);

    line-height: 1.8;

    text-shadow:
        2px 2px 0 black,
        -1px -1px 0 black,
        1px -1px 0 black,
        -1px 1px 0 black;

    white-space: pre-line;

    z-index: 2;
}

/* Continue indicator */

#nextIndicator {
    margin-top: 25px;

    color: black;

    font-family: Arial, sans-serif;

    font-size: 17px;

    opacity: 0;

    transition: opacity 0.5s ease;

    text-shadow:
        1px 1px 0 white,
        -1px -1px 0 white,
        1px -1px 0 white,
        -1px 1px 0 white;
}

#nextIndicator.visible {
    opacity: 1;
}

/* Fade transition for changing lore */

#loreContainer.changing {
    opacity: 0;

    transition: opacity 0.35s ease;
}

</style>
</head>

<body>

<div id="interactionLayer">

    <!-- WELCOME -->

    <div id="welcomeScreen">

        <div id="welcomeText"></div>

        <div id="proceedArea">

            <div id="proceedText">
                (Click to Proceed)
            </div>

            <img
                id="proceedButton"
                src="https://i.imgur.com/ugXJ5W7.png"
                alt="Click to Proceed"
            >

        </div>

    </div>


    <!-- LORE -->

    <div id="loreScreen">

        <div id="loreContainer">

            <img
                id="realmSymbol"
                src=""
                alt=""
            >

            <div style="position: relative; width: 100%;">

                <img
                    id="loreBox"
                    src="https://i.imgur.com/GePl0ts.png"
                    alt=""
                >

                <div id="loreText"></div>

            </div>

            <div id="nextIndicator">
                (Click to Continue)
            </div>

        </div>

    </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* -------------------- */
/* THREE.JS PANORAMA */
/* -------------------- */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 0, 0);


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


/* IMPORTANT:
   Keep this exact image order.
*/

const panoramaURLs = [

    "https://i.imgur.com/Qv1i6iu.jpeg",   // Right
    "https://i.imgur.com/DozXrgb.jpeg",   // Left
    "https://i.imgur.com/rOS65Sa.png",    // Top
    "https://i.imgur.com/AeNmcy7.jpeg",   // Bottom
    "https://i.imgur.com/07p3EMv.jpeg",   // Front
    "https://i.imgur.com/XH20czc.jpeg"    // Back

];


const loader = new THREE.TextureLoader();

const materials = panoramaURLs.map(url => {

    const texture = loader.load(url);

    return new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.BackSide
    });

});


const geometry = new THREE.BoxGeometry(
    100,
    100,
    100
);

const panorama = new THREE.Mesh(
    geometry,
    materials
);

scene.add(panorama);


/* Slow automatic rotation */

function animate() {

    requestAnimationFrame(animate);

    panorama.rotation.y += 0.0003;

    renderer.render(
        scene,
        camera
    );

}

animate();


/* Resize */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* -------------------- */
/* INTRO SYSTEM */
/* -------------------- */

const welcomeScreen =
    document.getElementById("welcomeScreen");

const welcomeText =
    document.getElementById("welcomeText");

const proceedArea =
    document.getElementById("proceedArea");

const loreScreen =
    document.getElementById("loreScreen");

const loreContainer =
    document.getElementById("loreContainer");

const loreText =
    document.getElementById("loreText");

const realmSymbol =
    document.getElementById("realmSymbol");

const nextIndicator =
    document.getElementById("nextIndicator");


/* -------------------- */
/* WELCOME TYPING */
/* -------------------- */

const welcomeMessage =
    "Welcome....";

let welcomeCharacter = 0;

function typeWelcome() {

    if (
        welcomeCharacter <
        welcomeMessage.length
    ) {

        welcomeText.textContent =
            welcomeMessage.slice(
                0,
                welcomeCharacter + 1
            );

        welcomeCharacter++;

        setTimeout(
            typeWelcome,
            250
        );

    } else {

        setTimeout(
            () => {

                proceedArea.classList.add(
                    "visible"
                );

            },
            1000
        );

    }

}


setTimeout(
    typeWelcome,
    1000
);


/* -------------------- */
/* REALM LORE */
/* -------------------- */

const lorePages = [

    {
        text:
            "You are about to enter the Overworld, one of five realms that make up this world.",

        symbol: null
    },

    {
        text:
            "The Overworld is green and warm, filled with life and growth.",

        symbol:
            "https://i.imgur.com/viHBHca.png"
    },

    {
        text:
            "The Nether is hot and smoky, filled with decay.",

        symbol:
            "https://i.imgur.com/Lwe6PNM.png"
    },

    {
        text:
            "The Aether is pastel and cool, filled with spirit.",

        symbol:
            "https://i.imgur.com/E2JL5Ia.png"
    },

    {
        text:
            "The Otherside is dark and chilling, filled with miasma and souls.",

        symbol:
            "https://i.imgur.com/4hB9YGV.png"
    },

    {
        text:
            "The End is dark and cold, yet burns with distant warmth, filled with everything and nothing.",

        symbol:
            "https://i.imgur.com/LZiGKoN.png"
    },

    {
        text:
            "Not every realm can be easily reached. Some may be places you never see at all.\n\nBut every one of you has been touched by one of them.",

        symbol: null
    }

];


let currentLorePage = 0;

let currentText = "";

let currentCharacter = 0;

let typing = false;

let typingTimer = null;


/* -------------------- */
/* START LORE */
/* -------------------- */

function startLore() {

    console.log(
        "Proceed button clicked!"
    );

    welcomeScreen.style.opacity = "0";
    welcomeScreen.style.transform =
        "scale(1.05)";

    proceedArea.style.pointerEvents =
        "none";


    setTimeout(
        () => {

            welcomeScreen.style.display =
                "none";

            loreScreen.classList.add(
                "visible"
            );

            typeLorePage();

        },
        700
    );

}


/* -------------------- */
/* TYPE LORE */
/* -------------------- */

function typeLorePage() {

    clearTimeout(typingTimer);

    loreContainer.classList.remove(
        "changing"
    );

    nextIndicator.classList.remove(
        "visible"
    );


    currentText =
        lorePages[currentLorePage].text;

    currentCharacter = 0;

    typing = true;


    /* Hide old symbol */

    realmSymbol.classList.remove(
        "visible"
    );


    const symbol =
        lorePages[currentLorePage].symbol;


    if (symbol) {

        realmSymbol.src = symbol;

        realmSymbol.alt = "";

    } else {

        realmSymbol.src = "";

    }


    typeNextCharacter();

}


/* -------------------- */
/* CHARACTER TYPING */
/* -------------------- */

function typeNextCharacter() {

    if (
        currentCharacter <
        currentText.length
    ) {

        loreText.textContent =
            currentText.slice(
                0,
                currentCharacter + 1
            );

        currentCharacter++;

        typingTimer = setTimeout(
            typeNextCharacter,
            45
        );

    } else {

        typing = false;

        /* Show symbol after typing */

        if (
            lorePages[currentLorePage].symbol
        ) {

            setTimeout(
                () => {

                    realmSymbol.classList.add(
                        "visible"
                    );

                },
                200
            );

        }


        setTimeout(
            () => {

                nextIndicator.classList.add(
                    "visible"
                );

            },
            700
        );

    }

}


/* -------------------- */
/* PROCEED CLICK */
/* -------------------- */

proceedArea.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();
        event.stopPropagation();

        console.log(
            "Proceed area pointer detected!"
        );

        startLore();

    }
);


/* -------------------- */
/* LORE CLICK */
/* -------------------- */

loreScreen.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();
        event.stopPropagation();


        /* If text is still typing,
           finish it immediately.
        */

        if (typing) {

            clearTimeout(
                typingTimer
            );

            loreText.textContent =
                currentText;

            currentCharacter =
                currentText.length;

            typing = false;


            if (
                lorePages[currentLorePage].symbol
            ) {

                realmSymbol.classList.add(
                    "visible"
                );

            }


            nextIndicator.classList.add(
                "visible"
            );

            return;

        }


        /* Last page */

        if (
            currentLorePage >=
            lorePages.length - 1
        ) {

            nextIndicator.classList.remove(
                "visible"
            );

            return;

        }


        /* Fade out */

        loreContainer.classList.add(
            "changing"
        );


        setTimeout(
            () => {

                currentLorePage++;

                typeLorePage();

            },
            350
        );

    }
);

</script>

</body>
</html>
```
