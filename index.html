<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ThalSMP 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
}


/* =========================
   LOADING SCREEN
   ========================= */

#loading {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
    color: white;

    font-family: "Press Start 2P", monospace;
    font-size: 18px;

    z-index: 50;
}


/* =========================
   WELCOME SCREEN
   ========================= */

#intro {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 10;

    pointer-events: auto;

    transition: opacity 0.7s ease;
}

#welcomeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}

#welcomeText {
    white-space: nowrap;

    font-family: "Press Start 2P", monospace;

    font-size: clamp(32px, 6vw, 90px);

    color: white;

    text-shadow:
        4px 4px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000;
}


/* =========================
   PROCEED AREA
   ========================= */

#proceedArea {
    margin-top: 25px;

    display: flex;
    flex-direction: column;
    align-items: center;

    opacity: 0;

    transition: opacity 0.5s ease;

    cursor: pointer;
    user-select: none;
}

#proceedText {
    margin-bottom: 12px;

    font-family: "Press Start 2P", monospace;

    font-size: clamp(7px, 1vw, 12px);

    color: #000;

    text-shadow:
        1px 1px 0 rgba(255,255,255,0.5);
}

#proceedButton {
    display: block;

    width: clamp(100px, 12vw, 170px);
    height: auto;

    cursor: pointer;
    user-select: none;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}

#proceedArea:hover #proceedButton {
    transform: scale(1.05);
    filter: brightness(1.1);
}

#proceedArea:active #proceedButton {
    transform: scale(0.97);
}


/* =========================
   LORE SCREEN
   ========================= */

#loreScreen {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 11;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.7s ease;
}


/* =========================
   LORE BOX
   ========================= */

#loreContainer {
    position: relative;

    width: min(80vw, 1000px);

    aspect-ratio: 334 / 154;

    image-rendering: pixelated;

    cursor: pointer;
    user-select: none;
}

#loreBox {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    image-rendering: pixelated;

    pointer-events: none;
}


/* =========================
   LORE TEXT
   ========================= */

#loreText {
    position: absolute;

    /*
       Original box:
       334 x 154

       Usable text area:
       280 x 112
    */

    left: 8.08%;
    top: 13%;

    width: 83.83%;
    height: 72.73%;

    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    text-align: center;

    font-family: "Press Start 2P", monospace;

    font-size: clamp(8px, 1.15vw, 16px);

    line-height: 1.8;

    color: #111;

    white-space: pre-line;

    overflow: hidden;

    user-select: none;

    pointer-events: none;
}


/* =========================
   NEXT INDICATOR
   ========================= */

#nextIndicator {
    position: absolute;

    bottom: -55px;
    left: 50%;

    transform: translateX(-50%);

    font-family: "Press Start 2P", monospace;

    font-size: clamp(7px, 0.9vw, 12px);

    color: #000;

    text-shadow:
        1px 1px 0 rgba(255,255,255,0.5);

    opacity: 0;

    transition: opacity 0.4s ease;

    white-space: nowrap;
}

#nextIndicator.visible {
    opacity: 1;

    animation: blink 1.2s infinite;
}

@keyframes blink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }

}


/* =========================
   ERROR
   ========================= */

#error {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    max-width: 80vw;

    padding: 20px;

    background: rgba(0,0,0,0.85);

    color: white;

    font-family: monospace;

    text-align: center;

    z-index: 100;

    display: none;
}

</style>
</head>


<body>


<!-- =========================
     LOADING
     ========================= -->

<div id="loading">
    Entering the world...
</div>


<!-- =========================
     WELCOME
     ========================= -->

<div id="intro">

    <div id="welcomeScreen">

        <div id="welcomeText"></div>

        <div id="proceedArea">

            <div id="proceedText">
                (Click to Proceed)
            </div>

            <img
                id="proceedButton"
                src="https://i.imgur.com/ugXJ5W7.png"
                alt="Click to Proceed"
            >

        </div>

    </div>

</div>


<!-- =========================
     LORE
     ========================= -->

<div id="loreScreen">

    <div id="loreContainer">

        <img
            id="loreBox"
            src="https://i.imgur.com/GePl0ts.png"
            alt=""
        >

        <div id="loreText"></div>

        <div id="nextIndicator">
            (Click to Continue)
        </div>

    </div>

</div>


<!-- =========================
     ERROR
     ========================= -->

<div id="error"></div>


<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   THREE.JS
   ========================================================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 0, 0);


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PANORAMA IMAGES
   ========================================================= */

const panoramaURLs = [

    "https://i.imgur.com/Qv1i6iu.jpeg",   // Right
    "https://i.imgur.com/DozXrgb.jpeg",    // Left
    "https://i.imgur.com/rOS65Sa.png",     // Top
    "https://i.imgur.com/AeNmcy7.jpeg",    // Bottom
    "https://i.imgur.com/07p3EMv.jpeg",    // Front
    "https://i.imgur.com/XH20czc.jpeg"     // Back

];


const loader = new THREE.TextureLoader();


try {

    /* =====================================================
       LOAD PANORAMA
       ===================================================== */

    const textures = await Promise.all(

        panoramaURLs.map(url => {

            return new Promise((resolve, reject) => {

                loader.load(
                    url,
                    resolve,
                    undefined,
                    reject
                );

            });

        })

    );


    /* =====================================================
       MATERIALS
       ===================================================== */

    const materials = textures.map(texture => {

        texture.colorSpace =
            THREE.SRGBColorSpace;

        return new THREE.MeshBasicMaterial({

            map: texture,

            side: THREE.BackSide

        });

    });


    /* =====================================================
       PANORAMA
       ===================================================== */

    const geometry =
        new THREE.BoxGeometry(
            100,
            100,
            100
        );


    const panorama =
        new THREE.Mesh(
            geometry,
            materials
        );


    scene.add(panorama);


    /* =====================================================
       HIDE LOADING
       ===================================================== */

    document.getElementById("loading")
        .style.display = "none";


    /* =====================================================
       ROTATION
       ===================================================== */

    let rotationY = 0;


    function animate() {

        requestAnimationFrame(animate);

        rotationY += 0.0003;

        panorama.rotation.y =
            rotationY;

        renderer.render(
            scene,
            camera
        );

    }


    animate();


    /* =====================================================
       WELCOME TYPEWRITER
       ===================================================== */

    const welcomeText =
        document.getElementById("welcomeText");

    const proceedArea =
        document.getElementById("proceedArea");

    const welcomeMessage =
        "Welcome....";

    let welcomeCharacter = 0;


    function typeWelcome() {

        if (
            welcomeCharacter <
            welcomeMessage.length
        ) {

            welcomeText.textContent +=
                welcomeMessage[welcomeCharacter];

            welcomeCharacter++;

            setTimeout(
                typeWelcome,
                250
            );

        } else {

            setTimeout(() => {

                proceedArea.style.opacity =
                    "1";

            }, 400);

        }

    }


    setTimeout(
        typeWelcome,
        1000
    );


    /* =====================================================
       LORE ELEMENTS
       ===================================================== */

    const welcomeScreen =
        document.getElementById("welcomeScreen");

    const loreScreen =
        document.getElementById("loreScreen");

    const loreText =
        document.getElementById("loreText");

    const nextIndicator =
        document.getElementById("nextIndicator");


    /* =====================================================
       LORE TEXT
       ===================================================== */

    const lorePages = [

        "You are about to enter the Overworld, one of five realms that make up this world.",

        "The Overworld is green and warm, filled with life and growth.\nThe Nether is hot and smoky, filled with decay.",

        "The Aether is pastel and cool, filled with spirit.\nThe Otherside is dark and chilling, filled with miasma and souls.",

        "The End is dark and cold, yet burns with distant warmth, filled with everything and nothing.",

        "Not every realm can be easily reached. Some may be places you never see at all.\nBut every one of you has been touched by one of them."

    ];


    let currentLorePage = 0;

    let typing = false;

    let typingTimer = null;

    let currentText = "";

    let currentCharacter = 0;


    /*
       Typing speed.
       Lower number = faster.
    */

    const typingSpeed = 35;


    /* =====================================================
       TYPE LORE PAGE
       ===================================================== */

    function typeLorePage() {

        clearTimeout(typingTimer);

        typing = true;

        nextIndicator.classList.remove(
            "visible"
        );

        currentText =
            lorePages[currentLorePage];

        currentCharacter = 0;

        loreText.textContent = "";


        function typeCharacter() {

            if (
                currentCharacter <
                currentText.length
            ) {

                loreText.textContent +=
                    currentText[currentCharacter];

                currentCharacter++;

                typingTimer = setTimeout(
                    typeCharacter,
                    typingSpeed
                );

            } else {

                typing = false;

                nextIndicator.classList.add(
                    "visible"
                );

            }

        }


        typeCharacter();

    }


    /* =====================================================
       START LORE
       ===================================================== */

    function startLore() {

        /*
           Stop any possibility of clicking
           the Welcome screen twice.
        */

        proceedArea.style.pointerEvents =
            "none";


        /*
           Fade Welcome away.
        */

        welcomeScreen.style.opacity =
            "0";

        welcomeScreen.style.transform =
            "translateY(-20px)";


        /*
           Wait for the fade,
           then show the lore box.
        */

        setTimeout(() => {

            welcomeScreen.style.display =
                "none";


            loreScreen.style.pointerEvents =
                "auto";


            loreScreen.style.opacity =
                "1";


            /*
               Give the box a moment to fade in
               before starting the text.
            */

            setTimeout(() => {

                typeLorePage();

            }, 500);

        }, 700);

    }


    /* =====================================================
       PROCEED CLICK
       ===================================================== */

    proceedArea.addEventListener(
        "click",
        (event) => {

            event.preventDefault();
            event.stopPropagation();

            startLore();

        }
    );


    /* =====================================================
       LORE CLICK
       ===================================================== */

    loreScreen.addEventListener(
        "click",
        (event) => {

            event.preventDefault();


            /*
               If the text is still typing,
               finish the current section.
            */

            if (typing) {

                clearTimeout(
                    typingTimer
                );

                loreText.textContent =
                    currentText;

                currentCharacter =
                    currentText.length;

                typing = false;

                nextIndicator.classList.add(
                    "visible"
                );

                return;

            }


            /*
               Move to the next section.
            */

            if (
                currentLorePage <
                lorePages.length - 1
            ) {

                currentLorePage++;

                typeLorePage();

                return;

            }


            /*
               End of the current introduction.

               We'll replace this later with
               whatever should happen after the
               final lore section.
            */

            nextIndicator.classList.remove(
                "visible"
            );

        }
    );


}
catch (error) {

    console.error(error);


    const errorBox =
        document.getElementById("error");


    errorBox.textContent =
        "The world could not be loaded. Check the browser console for details.";


    errorBox.style.display =
        "block";

}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
