<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ThalSMP 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* =========================
   PANORAMA
   ========================= */

canvas {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    display: block;

    z-index: 0;
}


/* =========================
   LOADING SCREEN
   ========================= */

#loading {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
    color: white;

    font-family: "Press Start 2P", monospace;
    font-size: 18px;

    z-index: 50;
}


/* =========================
   GENERAL INTRO CONTAINER
   ========================= */

#intro {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 10;

    pointer-events: none;

    transition: opacity 0.7s ease;
}


/* =========================
   WELCOME SCREEN
   ========================= */

#welcomeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;

    pointer-events: auto;

    text-align: center;

    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}


#welcomeText {
    white-space: nowrap;

    font-family: "Press Start 2P", monospace;

    font-size: clamp(32px, 6vw, 90px);

    color: white;

    text-shadow:
        4px 4px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000;
}


/* =========================
   PROCEED BUTTON
   ========================= */

#proceedArea {
    margin-top: 25px;

    display: flex;
    flex-direction: column;
    align-items: center;

    opacity: 0;

    transition: opacity 0.5s ease;
}


#proceedText {
    margin-bottom: 12px;

    font-family: "Press Start 2P", monospace;

    font-size: clamp(7px, 1vw, 12px);

    color: #000;

    text-shadow:
        1px 1px 0 rgba(255,255,255,0.5);
}


#proceedButton {
    display: block;

    width: clamp(100px, 12vw, 170px);
    height: auto;

    cursor: pointer;
    user-select: none;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}


#proceedButton:hover {
    transform: scale(1.05);

    filter: brightness(1.1);
}


#proceedButton:active {
    transform: scale(0.97);
}


/* =========================
   LORE SCREEN
   ========================= */

#loreScreen {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;

    opacity: 0;

    transition: opacity 0.7s ease;

    z-index: 11;
}


/* =========================
   LORE BOX
   ========================= */

#loreContainer {
    position: relative;

    /*
       The original image is 334 x 154.

       This width controls how large the box
       appears on screen.

       It scales with the screen while
       preserving the pixel-art proportions.
    */

    width: min(80vw, 1000px);

    aspect-ratio: 334 / 154;

    image-rendering: pixelated;

    pointer-events: auto;
}


/*
   The actual pixel-art box
*/

#loreBox {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    image-rendering: pixelated;

    user-select: none;

    pointer-events: none;
}


/* =========================
   LORE TEXT
   ========================= */

#loreText {
    position: absolute;

    /*
       These percentages are based on
       your original 280 x 112 text area.

       Original box:
       334 x 154

       Text area:
       280 x 112
    */

    left: 8.08%;
    top: 13.0%;

    width: 83.83%;
    height: 72.73%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    box-sizing: border-box;

    text-align: center;

    font-family: "Press Start 2P", monospace;

    /*
       This is intentionally small because
       we're scaling the entire box.
    */

    font-size: clamp(8px, 1.15vw, 16px);

    line-height: 1.8;

    color: #111;

    white-space: pre-line;

    overflow: hidden;

    /*
       Prevent accidental selection while
       clicking through the dialogue.
    */

    user-select: none;

    pointer-events: none;
}


/* =========================
   NEXT INDICATOR
   ========================= */

#nextIndicator {
    position: absolute;

    bottom: -55px;
    left: 50%;

    transform: translateX(-50%);

    font-family: "Press Start 2P", monospace;

    font-size: clamp(7px, 0.9vw, 12px);

    color: #000;

    text-shadow:
        1px 1px 0 rgba(255,255,255,0.5);

    opacity: 0;

    transition: opacity 0.4s ease;

    white-space: nowrap;
}


/*
   Tiny blinking effect once the text
   has finished typing.
*/

#nextIndicator.visible {
    opacity: 1;

    animation: blink 1.2s infinite;
}


@keyframes blink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }

}


/* =========================
   ERROR MESSAGE
   ========================= */

#error {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    max-width: 80vw;

    padding: 20px;

    background: rgba(0,0,0,0.85);

    color: white;

    font-family: monospace;

    text-align: center;

    z-index: 100;

    display: none;
}

</style>
</head>


<body>


<!-- =========================
     LOADING
     ========================= -->

<div id="loading">
    Entering the world...
</div>


<!-- =========================
     INTRO
     ========================= -->

<div id="intro">

    <!-- WELCOME SCREEN -->

    <div id="welcomeScreen">

        <div id="welcomeText"></div>

        <div id="proceedArea">

            <div id="proceedText">
                (Click to Proceed)
            </div>

            <img
                id="proceedButton"
                src="https://i.imgur.com/ugXJ5W7.png"
                alt="Click to Proceed"
            >

        </div>

    </div>

</div>


<!-- =========================
     LORE SCREEN
     ========================= -->

<div id="loreScreen">

    <div id="loreContainer">

        <img
            id="loreBox"
            src="https://i.imgur.com/GePl0ts.png"
            alt=""
        >

        <div id="loreText"></div>

        <div id="nextIndicator">
            (Click to Continue)
        </div>

    </div>

</div>


<!-- =========================
     ERROR
     ========================= -->

<div id="error"></div>


<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";



/* =========================================================
   THREE.JS PANORAMA
   ========================================================= */

const scene = new THREE.Scene();


const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);


camera.position.set(0, 0, 0);



const renderer = new THREE.WebGLRenderer({
    antialias: true
});


renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


document.body.appendChild(
    renderer.domElement
);



/* =========================================================
   PANORAMA IMAGES
   ========================================================= */

const panoramaURLs = [

    "https://i.imgur.com/Qv1i6iu.jpeg",   // Right
    "https://i.imgur.com/DozXrgb.jpeg",    // Left
    "https://i.imgur.com/rOS65Sa.png",     // Top
    "https://i.imgur.com/AeNmcy7.jpeg",    // Bottom
    "https://i.imgur.com/07p3EMv.jpeg",    // Front
    "https://i.imgur.com/XH20czc.jpeg"     // Back

];



const loader = new THREE.TextureLoader();



try {

    /* =====================================================
       LOAD PANORAMA
       ===================================================== */

    const textures = await Promise.all(

        panoramaURLs.map(url => {

            return new Promise((resolve, reject) => {

                loader.load(
                    url,
                    resolve,
                    undefined,
                    reject
                );

            });

        })

    );



    /* =====================================================
       PANORAMA MATERIALS
       ===================================================== */

    const materials = textures.map(texture => {

        texture.colorSpace =
            THREE.SRGBColorSpace;

        return new THREE.MeshBasicMaterial({

            map: texture,

            side: THREE.BackSide

        });

    });



    /* =====================================================
       PANORAMA MESH
       ===================================================== */

    const geometry =
        new THREE.BoxGeometry(
            100,
            100,
            100
        );


    const panorama =
        new THREE.Mesh(
            geometry,
            materials
        );


    scene.add(panorama);



    /* =====================================================
       HIDE LOADING SCREEN
       ===================================================== */

    document.getElementById("loading")
        .style.display = "none";



    /* =====================================================
       PANORAMA ROTATION
       ===================================================== */

    let rotationY = 0;


    function animate() {

        requestAnimationFrame(animate);


        rotationY += 0.0003;


        panorama.rotation.y =
            rotationY;


        renderer.render(
            scene,
            camera
        );

    }


    animate();



    /* =====================================================
       WELCOME TYPEWRITER
       ===================================================== */

    const welcomeText =
        document.getElementById("welcomeText");


    const proceedArea =
        document.getElementById("proceedArea");


    const welcomeMessage =
        "Welcome....";


    let welcomeCharacter = 0;



    function typeWelcome() {

        if (
            welcomeCharacter <
            welcomeMessage.length
        ) {

            welcomeText.textContent +=
                welcomeMessage[welcomeCharacter];


            welcomeCharacter++;


            setTimeout(
                typeWelcome,
                250
            );

        }

        else {

            setTimeout(() => {

                proceedArea.style.opacity = "1";

            }, 400);

        }

    }



    setTimeout(
        typeWelcome,
        1000
    );



    /* =====================================================
       LORE
       ===================================================== */

    const loreScreen =
        document.getElementById("loreScreen");


    const welcomeScreen =
        document.getElementById("welcomeScreen");


    const loreText =
        document.getElementById("loreText");


    const nextIndicator =
        document.getElementById("nextIndicator");


    const proceedButton =
        document.getElementById("proceedButton");



    /*
       Each entry is one "page" of dialogue.

       The text here is exactly what you provided.
    */

    const lorePages = [

        "You are about to enter the Overworld, one of five realms that make up this world.",

        "The Overworld is green and warm, filled with life and growth.\nThe Nether is hot and smoky, filled with decay.",

        "The Aether is pastel and cool, filled with spirit.\nThe Otherside is dark and chilling, filled with miasma and souls.",

        "The End is dark and cold, yet burns with distant warmth, filled with everything and nothing.",

        "Not every realm can be easily reached. Some may be places you never see at all.\nBut every one of you has been touched by one of them."

    ];



    let currentLorePage = 0;

    let typing = false;

    let typingTimer = null;

    let currentText = "";

    let currentCharacter = 0;



    /*
       Typing speed.

       Lower number = faster.
    */

    const typingSpeed = 35;



    /* =====================================================
       TYPE A LORE PAGE
       ===================================================== */

    function typeLorePage() {

        clearTimeout(typingTimer);


        typing = true;


        nextIndicator.classList.remove(
            "visible"
        );


        currentText =
            lorePages[currentLorePage];


        currentCharacter = 0;


        loreText.textContent = "";



        function typeCharacter() {

            if (
                currentCharacter <
                currentText.length
            ) {

                loreText.textContent +=
                    currentText[currentCharacter];


                currentCharacter++;


                typingTimer = setTimeout(
                    typeCharacter,
                    typingSpeed
                );

            }

            else {

                typing = false;


                nextIndicator.classList.add(
                    "visible"
                );

            }

        }


        typeCharacter();

    }



    /* =====================================================
       SHOW LORE SCREEN
       ===================================================== */

    function startLore() {

        /*
           Fade out Welcome
        */

        welcomeScreen.style.opacity = "0";


        welcomeScreen.style.transform =
            "translateY(-20px)";



        /*
           After the fade,
           disable the welcome screen.
        */

        setTimeout(() => {

            welcomeScreen.style.display =
                "none";

            loreScreen.style.pointerEvents =
                "auto";


            loreScreen.style.opacity =
                "1";


            /*
               Start first lore page.
            */

            setTimeout(() => {

                typeLorePage();

            }, 500);

        }, 700);

    }



    /* =====================================================
       CLICK WELCOME BUTTON
       ===================================================== */

    proceedButton.addEventListener(
        "click",
        startLore
    );



    /* =====================================================
       CLICK LORE SCREEN
       ===================================================== */

    loreScreen.addEventListener(
        "click",
        () => {

            /*
               If the current text is still typing,
               finish it immediately.
            */

            if (typing) {

                clearTimeout(
                    typingTimer
                );


                loreText.textContent =
                    currentText;


                currentCharacter =
                    currentText.length;


                typing = false;


                nextIndicator.classList.add(
                    "visible"
                );


                return;

            }



            /*
               If there are more pages,
               move to the next one.
            */

            if (
                currentLorePage <
                lorePages.length - 1
            ) {

                currentLorePage++;


                typeLorePage();

            }

            else {

                /*
                   This is where we'll eventually
                   transition into the actual website.

                   For now, we'll just hide the
                   continue indicator.
                */

                nextIndicator.classList.remove(
                    "visible"
                );

            }

        }
    );



}
catch (error) {

    console.error(error);


    const errorBox =
        document.getElementById("error");


    errorBox.textContent =
        "The world could not be loaded. Check the browser console for details.";


    errorBox.style.display =
        "block";

}



/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
