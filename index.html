<title>ThalSMP 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
>

<style>

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }


    /*
     * Loading screen
     */

    #loading {
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #000;
        color: white;

        font-family: "Press Start 2P", monospace;
        font-size: 18px;

        z-index: 10;
    }


    /*
     * Welcome screen
     */

    #welcome {
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;

        text-align: center;

        z-index: 5;
    }


    /*
     * Everything inside this container
     * can be clicked.
     */

    #welcomeContent {
        pointer-events: auto;

        cursor: pointer;

        display: flex;
        flex-direction: column;
        align-items: center;
    }


    /*
     * Main Welcome text
     */

    #welcomeText {

        white-space: nowrap;

        font-family:
            "Press Start 2P",
            monospace;

        font-size:
            clamp(32px, 6vw, 90px);

        color: white;

        text-shadow:
            4px 4px 0 #000,
            -2px -2px 0 #000,
            2px -2px 0 #000,
            -2px 2px 0 #000;
    }


    /*
     * Click to Proceed
     */

    #proceedText {

        margin-top: 25px;

        font-family:
            "Press Start 2P",
            monospace;

        font-size:
            clamp(8px, 1.2vw, 14px);

        color: #000;

        text-shadow:
            1px 1px 0 rgba(255, 255, 255, 0.35);

        opacity: 0;

        transition:
            opacity 0.5s ease;
    }


    /*
     * Error screen
     */

    #error {
        display: none;

        position: fixed;
        inset: 0;

        padding: 40px;
        box-sizing: border-box;

        background: #000;
        color: white;

        font-family: sans-serif;

        z-index: 20;
    }

</style>

</head>

<body>

```
<div id="loading">
    Entering the world...
</div>


<div id="welcome">

    <div id="welcomeContent">

        <div id="welcomeText"></div>

        <div id="proceedText">
            (Click to Proceed)
        </div>

    </div>

</div>


<div id="error"></div>


<script type="module">

    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


    /*
     * Scene
     */

    const scene =
        new THREE.Scene();


    /*
     * Camera
     */

    const camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
                window.innerHeight,
            0.1,
            100
        );


    camera.position.set(
        0,
        0,
        0
    );


    /*
     * Renderer
     */

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document.body.appendChild(
        renderer.domElement
    );


    /*
     * Working panorama
     */

    const panoramaURLs = [

        "https://i.imgur.com/Qv1i6iu.jpeg",
        "https://i.imgur.com/DozXrgb.jpeg",
        "https://i.imgur.com/rOS65Sa.png",
        "https://i.imgur.com/AeNmcy7.jpeg",
        "https://i.imgur.com/07p3EMv.jpeg",
        "https://i.imgur.com/XH20czc.jpeg"

    ];


    const loader =
        new THREE.TextureLoader();


    try {


        /*
         * Load panorama textures
         */

        const textures =
            await Promise.all(

                panoramaURLs.map(
                    url => {

                        return new Promise(
                            (
                                resolve,
                                reject
                            ) => {

                                loader.load(

                                    url,

                                    texture =>
                                        resolve(texture),

                                    undefined,

                                    error =>
                                        reject(error)

                                );

                            }
                        );

                    }
                )

            );


        /*
         * Materials
         */

        const materials =
            textures.map(
                texture => {

                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    return new THREE.MeshBasicMaterial({

                        map: texture,

                        side:
                            THREE.BackSide

                    });

                }
            );


        /*
         * Panorama cube
         */

        const geometry =
            new THREE.BoxGeometry(
                100,
                100,
                100
            );


        const panorama =
            new THREE.Mesh(
                geometry,
                materials
            );


        scene.add(
            panorama
        );


        /*
         * Hide loading screen
         */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        /*
         * Automatic rotation
         *
         * No dragging.
         * No mouse controls.
         * No touch controls.
         */

        let rotationY = 0;


        function animate() {

            requestAnimationFrame(
                animate
            );


            rotationY +=
                0.0003;


            panorama.rotation.y =
                rotationY;


            renderer.render(
                scene,
                camera
            );

        }


        animate();


        /*
         * Welcome typewriter
         */

        const welcomeText =
            document.getElementById(
                "welcomeText"
            );


        const proceedText =
            document.getElementById(
                "proceedText"
            );


        const message =
            "Welcome....";


        let character = 0;


        function typeWelcome() {

            if (
                character <
                message.length
            ) {

                welcomeText.textContent +=
                    message[character];


                character++;


                setTimeout(
                    typeWelcome,
                    250
                );

            }
            else {

                /*
                 * Show the click prompt
                 * after Welcome finishes.
                 */

                setTimeout(
                    () => {

                        proceedText.style.opacity =
                            "1";

                    },
                    400
                );

            }

        }


        /*
         * Begin typing after
         * the panorama loads.
         */

        setTimeout(
            typeWelcome,
            1000
        );


        /*
         * Click prompt
         *
         * This doesn't navigate anywhere
         * yet. We'll connect it to the
         * next screen later.
         */

        document.getElementById(
            "welcomeContent"
        ).addEventListener(
            "click",
            () => {

                console.log(
                    "Welcome screen clicked."
                );

            }
        );


    }
    catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        const errorBox =
            document.getElementById(
                "error"
            );


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "Something went wrong while loading the world.";

    }


    /*
     * Resize
     */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>
```
