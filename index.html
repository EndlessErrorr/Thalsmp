```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ThalSMP 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
    pointer-events: none;
}

#loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: white;
    font-family: "Press Start 2P", monospace;
    font-size: 18px;
    z-index: 1000;
}

#interactionLayer {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: auto;
}

#welcomeScreen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    opacity: 1;
    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}

#welcomeText {
    white-space: nowrap;
    font-family: "Press Start 2P", monospace;
    font-size: clamp(32px, 6vw, 90px);
    color: white;
    text-shadow:
        4px 4px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000;
}

#proceedArea {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transition:
        opacity 0.5s ease;
    cursor: pointer;
    user-select: none;
    pointer-events: auto;
}

#proceedText {
    margin-bottom: 12px;
    font-family: "Press Start 2P", monospace;
    font-size: clamp(7px, 1vw, 12px);
    color: #000;
    text-shadow:
        1px 1px 0 rgba(255,255,255,0.5);
    pointer-events: none;
}

#proceedButton {
    display: block;
    width: clamp(100px, 12vw, 170px);
    height: auto;
    cursor: pointer;
    user-select: none;
    pointer-events: auto;
    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}

#proceedArea:hover #proceedButton {
    transform: scale(1.05);
    filter: brightness(1.1);
}

#proceedArea:active #proceedButton {
    transform: scale(0.97);
}

#loreScreen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition:
        opacity 0.7s ease;
}

#loreContainer {
    position: relative;
    width: min(80vw, 1000px);
    aspect-ratio: 334 / 154;
    image-rendering: pixelated;
    cursor: pointer;
    user-select: none;
}

#loreBox {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    pointer-events: none;
}

#realmSymbol {
    position: absolute;
    left: 50%;
    top: 18%;
    transform:
        translateX(-50%)
        scale(0.8);
    width: 24%;
    height: 34%;
    object-fit: contain;
    image-rendering: pixelated;
    opacity: 0;
    transition:
        opacity 0.6s ease,
        transform 0.6s ease;
    pointer-events: none;
    z-index: 2;
}

#realmSymbol.visible {
    opacity: 1;
    transform:
        translateX(-50%)
        scale(1);
}

#loreText {
    position: absolute;
    left: 8.08%;
    top: 13%;
    width: 83.83%;
    height: 72.73%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    text-align: center;
    font-family: "Press Start 2P", monospace;
    font-size: clamp(11px, 1.5vw, 21px);
    line-height: 1.7;
    color: #111;
    white-space: pre-line;
    overflow: hidden;
    user-select: none;
    pointer-events: none;
    z-index: 3;
}

#loreText.realmText {
    align-items: flex-end;
    padding-bottom: 3%;
}

#nextIndicator {
    position: absolute;
    bottom: -55px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Press Start 2P", monospace;
    font-size: clamp(7px, 0.9vw, 12px);
    color: #000;
    text-shadow:
        1px 1px 0 rgba(255,255,255,0.5);
    opacity: 0;
    white-space: nowrap;
    transition:
        opacity 0.4s ease;
}

#nextIndicator.visible {
    opacity: 1;
    animation:
        blink 1.2s infinite;
}

@keyframes blink {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }

}

#error {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 80vw;
    padding: 20px;
    background: rgba(0,0,0,0.85);
    color: white;
    font-family: monospace;
    text-align: center;
    z-index: 2000;
    display: none;
}

</style>
</head>

<body>

<div id="loading">
    Entering the world...
</div>

<div id="interactionLayer">

    <div id="welcomeScreen">

        <div id="welcomeText"></div>

        <div id="proceedArea">

            <div id="proceedText">
                (Click to Proceed)
            </div>

            <img
                id="proceedButton"
                src="https://i.imgur.com/ugXJ5W7.png"
                alt="Click to Proceed"
            >

        </div>

    </div>

    <div id="loreScreen">

        <div id="loreContainer">

            <img
                id="loreBox"
                src="https://i.imgur.com/GePl0ts.png"
                alt=""
            >

            <img
                id="realmSymbol"
                src=""
                alt=""
            >

            <div id="loreText"></div>

            <div id="nextIndicator">
                (Click to Continue)
            </div>

        </div>

    </div>

</div>

<div id="error"></div>

<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    0,
    0
);

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

const panoramaURLs = [

    "https://i.imgur.com/Qv1i6iu.jpeg",
    "https://i.imgur.com/DozXrgb.jpeg",
    "https://i.imgur.com/rOS65Sa.png",
    "https://i.imgur.com/AeNmcy7.jpeg",
    "https://i.imgur.com/07p3EMv.jpeg",
    "https://i.imgur.com/XH20czc.jpeg"

];

const loader =
    new THREE.TextureLoader();

try {

    const textures =
        await Promise.all(

            panoramaURLs.map(
                url => {

                    return new Promise(
                        (resolve, reject) => {

                            loader.load(
                                url,
                                resolve,
                                undefined,
                                reject
                            );

                        }
                    );

                }
            )

        );

    const materials =
        textures.map(
            texture => {

                texture.colorSpace =
                    THREE.SRGBColorSpace;

                return new THREE.MeshBasicMaterial({

                    map: texture,

                    side: THREE.BackSide

                });

            }
        );

    const geometry =
        new THREE.BoxGeometry(
            100,
            100,
            100
        );

    const panorama =
        new THREE.Mesh(
            geometry,
            materials
        );

    scene.add(
        panorama
    );

    document.getElementById(
        "loading"
    ).style.display = "none";

    let rotationY = 0;

    function animate() {

        requestAnimationFrame(
            animate
        );

        rotationY += 0.0003;

        panorama.rotation.y =
            rotationY;

        renderer.render(
            scene,
            camera
        );

    }

    animate();

    const welcomeText =
        document.getElementById(
            "welcomeText"
        );

    const proceedArea =
        document.getElementById(
            "proceedArea"
        );

    const welcomeScreen =
        document.getElementById(
            "welcomeScreen"
        );

    const loreScreen =
        document.getElementById(
            "loreScreen"
        );

    const loreText =
        document.getElementById(
            "loreText"
        );

    const realmSymbol =
        document.getElementById(
            "realmSymbol"
        );

    const nextIndicator =
        document.getElementById(
            "nextIndicator"
        );

    const welcomeMessage =
        "Welcome....";

    let welcomeCharacter = 0;

    function typeWelcome() {

        if (
            welcomeCharacter <
            welcomeMessage.length
        ) {

            welcomeText.textContent +=
                welcomeMessage[
                    welcomeCharacter
                ];

            welcomeCharacter++;

            setTimeout(
                typeWelcome,
                250
            );

        }

        else {

            setTimeout(
                () => {

                    proceedArea.style.opacity =
                        "1";

                },
                400
            );

        }

    }

    setTimeout(
        typeWelcome,
        1000
    );

    const lorePages = [

        {
            text:
                "You are about to enter the Overworld, one of five realms that make up this world.",

            symbol:
                null
        },

        {
            text:
                "The Overworld is green and warm, filled with life and growth.",

            symbol:
                "https://i.imgur.com/viHBHca.png"
        },

        {
            text:
                "The Nether is hot and smoky, filled with decay.",

            symbol:
                "https://i.imgur.com/Lwe6PNM.png"
        },

        {
            text:
                "The Aether is pastel and cool, filled with spirit.",

            symbol:
                "https://i.imgur.com/E2JL5Ia.png"
        },

        {
            text:
                "The Otherside is dark and chilling, filled with miasma and souls.",

            symbol:
                "https://i.imgur.com/4hB9YGV.png"
        },

        {
            text:
                "The End is dark and cold, yet burns with distant warmth, filled with everything and nothing.",

            symbol:
                "https://i.imgur.com/LZiGKoN.png"
        },

        {
            text:
                "Not every realm can be easily reached. Some may be places you never see at all.\nBut every one of you has been touched by one of them.",

            symbol:
                null
        }

    ];

    let currentLorePage = 0;

    let typing = false;

    let typingTimer = null;

    let currentText = "";

    let currentCharacter = 0;

    const typingSpeed = 35;

    function typeLorePage() {

        clearTimeout(
            typingTimer
        );

        typing = true;

        nextIndicator.classList.remove(
            "visible"
        );

        currentText =
            lorePages[
                currentLorePage
            ].text;

        currentCharacter = 0;

        loreText.textContent = "";

        if (
            lorePages[
                currentLorePage
            ].symbol
        ) {

            loreText.classList.add(
                "realmText"
            );

        }

        else {

            loreText.classList.remove(
                "realmText"
            );

        }

        /* Hide the old symbol first */
        realmSymbol.classList.remove(
            "visible"
        );

        /* Wait for the fade-out to finish */
        setTimeout(
            () => {

                const newSymbol =
                    lorePages[
                        currentLorePage
                    ].symbol;

                if (newSymbol) {

                    realmSymbol.src =
                        newSymbol;

                }

                else {

                    realmSymbol.removeAttribute(
                        "src"
                    );

                }

            },
            600
        );

        function typeCharacter() {

            if (
                currentCharacter <
                currentText.length
            ) {

                loreText.textContent +=
                    currentText[
                        currentCharacter
                    ];

                currentCharacter++;

                typingTimer =
                    setTimeout(
                        typeCharacter,
                        typingSpeed
                    );

            }

            else {

                typing = false;

                if (
                    lorePages[
                        currentLorePage
                    ].symbol
                ) {

                    setTimeout(
                        () => {

                            realmSymbol.classList.add(
                                "visible"
                            );

                        },
                        150
                    );

                }

                setTimeout(
                    () => {

                        nextIndicator.classList.add(
                            "visible"
                        );

                    },
                    600
                );

            }

        }

        typeCharacter();

    }

    function startLore() {

        console.log(
            "Proceed button clicked!"
        );

        proceedArea.style.pointerEvents =
            "none";

        welcomeScreen.style.opacity =
            "0";

        welcomeScreen.style.transform =
            "translateY(-20px)";

        setTimeout(
            () => {

                welcomeScreen.style.display =
                    "none";

                loreScreen.style.pointerEvents =
                    "auto";

                loreScreen.style.opacity =
                    "1";

                setTimeout(
                    () => {

                        typeLorePage();

                    },
                    500
                );

            },
            700
        );

    }

    proceedArea.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            event.stopPropagation();

            console.log(
                "Proceed area pointer detected!"
            );

            startLore();

        }
    );

    loreScreen.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            event.stopPropagation();

            if (typing) {

                clearTimeout(
                    typingTimer
                );

                loreText.textContent =
                    currentText;

                currentCharacter =
                    currentText.length;

                typing = false;

                if (
                    lorePages[
                        currentLorePage
                    ].symbol
                ) {

                    realmSymbol.classList.add(
                        "visible"
                    );

                }

                nextIndicator.classList.add(
                    "visible"
                );

                return;

            }

            if (
                currentLorePage <
                lorePages.length - 1
            ) {

                currentLorePage++;

                typeLorePage();

                return;

            }

            nextIndicator.classList.remove(
                "visible"
            );

        }
    );

}
catch (error) {

    console.error(
        error
    );

    const errorBox =
        document.getElementById(
            "error"
        );

    errorBox.textContent =
        "The world could not be loaded. Check the browser console for details.";

    errorBox.style.display =
        "block";

}

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
