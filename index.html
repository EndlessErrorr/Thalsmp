```
<div id="loading">
    Entering the world...
</div>

<div id="welcome">
    <span id="welcomeText"></span>
</div>

<div id="error"></div>

<script type="module">

    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


    /*
     * Scene
     */

    const scene = new THREE.Scene();


    /*
     * Camera
     */

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

    camera.position.set(0, 0, 0);


    /*
     * Renderer
     */

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(renderer.domElement);


    /*
     * Panorama images
     *
     * THREE.BoxGeometry expects:
     *
     * 1. Right
     * 2. Left
     * 3. Top
     * 4. Bottom
     * 5. Front
     * 6. Back
     */

    const panoramaURLs = [

        "https://i.imgur.com/Qv1i6iu.jpeg",   // Right
        "https://i.imgur.com/DozXrgb.jpeg",   // Left
        "https://i.imgur.com/rOS65Sa.png",    // Top
        "https://i.imgur.com/AeNmcy7.jpeg",   // Bottom
        "https://i.imgur.com/07p3EMv.jpeg",   // Front
        "https://i.imgur.com/XH20czc.jpeg"    // Back

    ];


    const loader = new THREE.TextureLoader();


    try {

        /*
         * Load panorama
         */

        const textures = await Promise.all(

            panoramaURLs.map(url => {

                return new Promise((resolve, reject) => {

                    loader.load(

                        url,

                        texture => resolve(texture),

                        undefined,

                        error => reject(error)

                    );

                });

            })

        );


        /*
         * Create materials
         */

        const materials = textures.map(texture => {

            texture.colorSpace =
                THREE.SRGBColorSpace;

            return new THREE.MeshBasicMaterial({

                map: texture,

                side: THREE.BackSide

            });

        });


        /*
         * Create panorama cube
         */

        const geometry =
            new THREE.BoxGeometry(
                100,
                100,
                100
            );


        const panorama =
            new THREE.Mesh(
                geometry,
                materials
            );


        scene.add(panorama);


        /*
         * Hide loading screen
         */

        document.getElementById(
            "loading"
        ).style.display = "none";


        /*
         * Automatic panorama rotation
         *
         * No mouse dragging.
         * No touch controls.
         */

        let rotationY = 0;


        function animate() {

            requestAnimationFrame(animate);


            rotationY += 0.0003;


            panorama.rotation.y =
                rotationY;


            renderer.render(
                scene,
                camera
            );

        }


        animate();


        /*
         * Welcome typewriter
         */

        const welcomeText =
            document.getElementById(
                "welcomeText"
            );


        const message =
            "Welcome....";


        let character = 0;


        function typeWelcome() {

            if (
                character <
                message.length
            ) {

                welcomeText.textContent +=
                    message[character];


                character++;


                /*
                 * Slower typing speed
                 */

                setTimeout(
                    typeWelcome,
                    250
                );

            }

        }


        /*
         * Wait a little before
         * beginning the text.
         */

        setTimeout(
            typeWelcome,
            1000
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "loading"
        ).style.display = "none";


        const errorBox =
            document.getElementById(
                "error"
            );


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "Something went wrong while loading the world.";

    }


    /*
     * Resize
     */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>
