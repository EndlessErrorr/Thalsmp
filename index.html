
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ThalSMP 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =========================================================
   PANORAMA
   ========================================================= */

canvas {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    display: block;

    z-index: 0;

    pointer-events: none;
}


/* =========================================================
   LOADING
   ========================================================= */

#loading {
    position: fixed;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    color: white;

    font-family: "Press Start 2P", monospace;

    font-size: 18px;

    z-index: 1000;
}


/* =========================================================
   MAIN INTERACTION LAYER
   ========================================================= */

#interactionLayer {
    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: auto;
}


/* =========================================================
   WELCOME SCREEN
   ========================================================= */

#welcomeScreen {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    opacity: 1;

    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}


/* =========================================================
   WELCOME TEXT
   ========================================================= */

#welcomeText {
    white-space: nowrap;

    font-family: "Press Start 2P", monospace;

    font-size: clamp(32px, 6vw, 90px);

    color: white;

    text-shadow:
        4px 4px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000;
}


/* =========================================================
   PROCEED AREA
   ========================================================= */

#proceedArea {
    margin-top: 25px;

    display: flex;

    flex-direction: column;

    align-items: center;

    opacity: 0;

    transition:
        opacity 0.5s ease;

    cursor: pointer;

    user-select: none;

    pointer-events: auto;
}


/* =========================================================
   PROCEED TEXT
   ========================================================= */

#proceedText {
    margin-bottom: 12px;

    font-family: "Press Start 2P", monospace;

    font-size: clamp(7px, 1vw, 12px);

    color: #000;

    text-shadow:
        1px 1px 0 rgba(255,255,255,0.5);

    pointer-events: none;
}


/* =========================================================
   PROCEED BUTTON
   ========================================================= */

#proceedButton {
    display: block;

    width: clamp(100px, 12vw, 170px);

    height: auto;

    cursor: pointer;

    user-select: none;

    pointer-events: auto;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}


#proceedArea:hover #proceedButton {
    transform: scale(1.05);

    filter: brightness(1.1);
}


#proceedArea:active #proceedButton {
    transform: scale(0.97);
}


/* =========================================================
   LORE SCREEN
   ========================================================= */

#loreScreen {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.7s ease;
}


/* =========================================================
   LORE CONTAINER
   ========================================================= */

#loreContainer {
    position: relative;

    width: min(80vw, 1000px);

    aspect-ratio: 334 / 154;

    image-rendering: pixelated;

    cursor: pointer;

    user-select: none;
}


/* =========================================================
   LORE BOX IMAGE
   ========================================================= */

#loreBox {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    image-rendering: pixelated;

    pointer-events: none;
}


/* =========================================================
   REALM SYMBOL
   ========================================================= */

#realmSymbol {
    position: absolute;

    left: 50%;

    top: 18%;

    transform:
        translateX(-50%)
        scale(0.8);

    width: 24%;

    height: 34%;

    object-fit: contain;

    image-rendering: pixelated;

    opacity: 0;

    transition:
        opacity 0.6s ease,
        transform 0.6s ease;

    pointer-events: none;

    z-index: 2;
}


#realmSymbol.visible {
    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}


/* =========================================================
   LORE TEXT
   ========================================================= */

#loreText {
    position: absolute;

    left: 8.08%;
    top: 13%;

    width: 83.83%;
    height: 72.73%;

    box-sizing: border-box;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    text-align: center;

    font-family: "Press Start 2P", monospace;

    font-size: clamp(11px, 1.5vw, 21px);

    line-height: 1.7;

    color: #111;

    white-space: pre-line;

    overflow: hidden;

    user-select: none;

    pointer-events: none;

    z-index: 3;
}


/* =========================================================
   REALM TEXT POSITION
   ========================================================= */

#loreText.realmText {
    align-items: flex-end;

    padding-bottom: 3%;
}


/* =========================================================
   MAGIC TITLE
   ========================================================= */

#loreText.magicTitle {
    font-size: clamp(24px, 4vw, 56px);

    align-items: center;

    padding-bottom: 0;
}


/* =========================================================
   MAGIC TEXT
   ========================================================= */

#loreText.magicText {
    align-items: center;

    padding-bottom: 0;
}


/* =========================================================
   FINAL REALM CHOICE TEXT
   ========================================================= */

#loreText.realmChoiceText {
    align-items: flex-start;

    padding-top: 8%;
}


/* =========================================================
   NEXT INDICATOR
   ========================================================= */

#nextIndicator {
    position: absolute;

    bottom: -55px;

    left: 50%;

    transform: translateX(-50%);

    font-family: "Press Start 2P", monospace;

    font-size: clamp(7px, 0.9vw, 12px);

    color: #000;

    text-shadow:
        1px 1px 0 rgba(255,255,255,0.5);

    opacity: 0;

    white-space: nowrap;

    transition:
        opacity 0.4s ease;
}


#nextIndicator.visible {
    opacity: 1;

    animation:
        blink 1.2s infinite;
}


@keyframes blink {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }

}


/* =========================================================
   MAGIC REALM BUTTONS
   ========================================================= */

#realmButtons {
    position: absolute;

    left: 50%;

    bottom: 17%;

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 3%;

    width: 84%;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.6s ease;
}


#realmButtons.visible {
    opacity: 1;

    pointer-events: auto;
}


.realmButton {
    display: block;

    width: 15%;

    aspect-ratio: 1;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;

    user-select: none;
}


.realmButton img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    image-rendering: pixelated;

    pointer-events: none;
}


.realmButton:hover {
    transform: scale(1.12);

    filter: brightness(1.15);
}


.realmButton:active {
    transform: scale(0.95);
}


/* =========================================================
   ERROR
   ========================================================= */

#error {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    max-width: 80vw;

    padding: 20px;

    background: rgba(0,0,0,0.85);

    color: white;

    font-family: monospace;

    text-align: center;

    z-index: 2000;

    display: none;
}

</style>
</head>
