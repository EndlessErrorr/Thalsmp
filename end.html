
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>End Panorama Test</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.domElement.style.position = "fixed";
    renderer.domElement.style.top = "0";
    renderer.domElement.style.left = "0";
    renderer.domElement.style.width = "100vw";
    renderer.domElement.style.height = "100vh";
    renderer.domElement.style.pointerEvents = "none";

    document.body.appendChild(renderer.domElement);

    /*
        User supplied order:

        Front
        Right
        Back
        Left
        Up
        Down

        Three.js BoxGeometry order:

        Right
        Left
        Top
        Bottom
        Front
        Back
    */

    const panoramaURLs = [
        "https://i.imgur.com/Ect30c7.jpeg",  // Right
        "https://i.imgur.com/qyRFzM5.jpeg",  // Left
        "https://i.imgur.com/oncFUFI.png",   // Top
        "https://i.imgur.com/10Nwqok.png",   // Bottom
        "https://i.imgur.com/wwnCOJH.jpeg",  // Front
        "https://i.imgur.com/seoC63G.jpeg"   // Back
    ];

    const loader = new THREE.TextureLoader();
    const materials = [];

    panoramaURLs.forEach((url) => {
        loader.load(
            url,
            (texture) => {

                texture.colorSpace =
                    THREE.SRGBColorSpace;

                materials.push(
                    new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.BackSide
                    })
                );

                if (
                    materials.length ===
                    panoramaURLs.length
                ) {
                    createPanorama();
                }
            },
            undefined,
            (error) => {
                console.error(
                    "Failed to load panorama texture:",
                    url,
                    error
                );
            }
        );
    });

    function createPanorama() {

        const geometry =
            new THREE.BoxGeometry(
                100,
                100,
                100
            );

        const panorama =
            new THREE.Mesh(
                geometry,
                materials
            );

        scene.add(panorama);

        animate();
    }

    function animate() {

        requestAnimationFrame(
            animate
        );

        scene.rotation.y += 0.0003;

        renderer.render(
            scene,
            camera
        );
    }

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    );
</script>

</body>
</html>
